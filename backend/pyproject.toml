[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyfloor"
version = "0.1.0"
description = "Polyfloor — autonomous multi-company enterprise engine with a GBA/DS department-store UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[project.scripts]
polyfloor = "polyfloor.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/polyfloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
