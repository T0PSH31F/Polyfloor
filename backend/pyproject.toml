[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyfloor"
version = "0.1.0"
description = "Multi-floor AI company OS — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "asyncpg>=0.30",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.28",
    "sse-starlette>=2.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx",
    "ruff>=0.9",
    "mypy>=1.14",
]
mcp = [
    "mcp>=1.0",
]
agents = [
    "crewai>=0.100",
    "langgraph>=0.2",
]

[project.scripts]
polyfloor = "polyfloor.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/polyfloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires POLYFLOOR_TEST_DATABASE_DSN",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
